<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosco</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #080C14; overflow: hidden; }

    #splash {
      position: fixed; inset: 0;
      background: #080C14;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px; z-index: 999;
      transition: opacity 0.5s ease;
    }
    #splash.oculto { opacity: 0; pointer-events: none; }

    .splash-logo {
      width: 96px; height: 96px; border-radius: 32px;
      background: linear-gradient(135deg, #4A90E2 0%, #2D6BC4 55%, #1A4A8A 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 1px rgba(74,144,226,0.4), 0 12px 36px rgba(74,144,226,0.3);
    }
    .splash-logo svg { width: 54px; height: 54px; }
    .splash-nombre {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 2rem; font-weight: 500; color: #E8F0FC;
      letter-spacing: 0.05em;
    }
    .splash-loader {
      width: 48px; height: 3px; border-radius: 99px;
      background: rgba(74,144,226,0.2); overflow: hidden;
    }
    .splash-loader-fill {
      height: 100%; width: 0; border-radius: 99px;
      background: linear-gradient(90deg, #4A90E2, #A8C8F0);
      animation: carga 1.8s ease-in-out forwards;
    }
    @keyframes carga {
      0%  { width: 0; }
      60% { width: 80%; }
      100%{ width: 100%; }
    }

    #frame {
      width: 100%; height: 100%; border: none;
      position: fixed; inset: 0;
    }

    #error {
      display: none; position: fixed; inset: 0;
      background: #080C14; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 32px;
    }
    #error.visible { display: flex; }
    #error p { color: #8BA8CC; font-family: system-ui; font-size: 1rem; line-height: 1.6; }
    #error strong { color: #E8F0FC; font-size: 1.1rem; }
    #retry {
      margin-top: 8px; padding: 12px 28px; border-radius: 999px;
      background: linear-gradient(135deg, #4A90E2, #2D6BC4);
      color: #fff; font-family: system-ui; font-size: 0.95rem;
      border: none; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Pantalla de carga -->
  <div id="splash">
    <div class="splash-logo">
      <!-- K logo -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#EAF2FF"/>
            <stop offset="1" stop-color="#5E93FF"/>
          </linearGradient>
        </defs>
        <path d="M1.25 3.33L1.32 20.37Q1.32 21.57 2.03 20.60L13.07 5.34Q13.78 4.37 14.98 4.35L17.03 4.32Q18.23 4.30 18.12 4.62L18.10 4.68Q18.00 5.01 17.30 5.98L13.62 11.07Q12.92 12.04 13.62 13.01L17.60 18.54Q18.30 19.52 17.10 19.54L15.05 19.57Q13.85 19.59 13.15 18.62L11.30 16.08Q10.60 15.10 9.94 16.03L9.83 16.19Q9.18 17.12 9.89 18.09L11.94 20.83Q12.65 21.80 13.85 21.81L21.55 21.90Q22.75 21.91 22.05 20.93L16.42 13.01Q15.72 12.04 16.41 11.06L22.02 3.07Q22.71 2.09 21.51 2.09L13.85 2.09Q12.65 2.09 11.95 3.06L4.27 13.68Q3.57 14.65 3.56 13.45L3.47 5.57Q3.46 4.37 4.66 4.34L5.51 4.32Q6.71 4.30 7.44 3.35L7.66 3.08Q8.39 2.13 7.19 2.13L2.45 2.13Q1.25 2.13 1.25 3.33Z"
              fill="url(#kg)" fill-rule="evenodd"/>
      </svg>
    </div>
    <div class="splash-nombre">Kiosco</div>
    <div class="splash-loader"><div class="splash-loader-fill"></div></div>
  </div>

  <!-- Frame de la app -->
  <iframe id="frame" src="https://kiosco-ia.streamlit.app/?embed=true" allowfullscreen
    allow="camera; microphone; geolocation"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-top-navigation">
  </iframe>

  <!-- Pantalla de error de conexión -->
  <div id="error">
    <strong>Sin conexión</strong>
    <p>No se pudo conectar con el servidor.<br>Verificá que la app esté corriendo y que estés en la misma red.</p>
    <button id="retry" onclick="reintentar()">Reintentar</button>
  </div>

  <script>
    const STREAMLIT_URL = "https://kiosco-ia.streamlit.app/?embed=true";
    const frame = document.getElementById("frame");
    const splash = document.getElementById("splash");
    const error = document.getElementById("error");

    // Ocultar splash cuando carga el iframe
    frame.addEventListener("load", () => {
      setTimeout(() => {
        splash.classList.add("oculto");
      }, 400);
    });

    // Detectar error de carga
    frame.addEventListener("error", mostrarError);

    // Timeout: si en 15s no cargó, mostrar error
    const timeout = setTimeout(() => {
      if (!splash.classList.contains("oculto")) {
        mostrarError();
      }
    }, 15000);

    frame.addEventListener("load", () => clearTimeout(timeout));

    function mostrarError() {
      splash.classList.add("oculto");
      error.classList.add("visible");
    }

    function reintentar() {
      error.classList.remove("visible");
      splash.classList.remove("oculto");
      frame.src = STREAMLIT_URL + "?t=" + Date.now();
    }
  </script>
</body>
</html>
