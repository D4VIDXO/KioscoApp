name: Build APK Kiosco

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias npm
        run: npm install

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Sincronizar proyecto
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kiosco-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
